name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: npm test
      - name: Dogfood
        run: node git-heat.js --since "5 years ago" --md >> "$GITHUB_STEP_SUMMARY"
